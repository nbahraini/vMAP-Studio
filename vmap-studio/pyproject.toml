[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vmap-studio"
version = "0.1.0"
description = "Modular, cross-platform mind mapping and visual thinking platform (Phase 1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
vmap = "vmap.cli.main:main"

[project.gui-scripts]
vmap-studio = "vmap.app:main"

[tool.setuptools.packages.find]
include = ["vmap*"]

[tool.setuptools.package-data]
"vmap.themes" = ["builtin/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
